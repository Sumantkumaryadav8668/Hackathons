<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Canvas Card -->
  <rect width="800" height="600" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Outer Frame Boundary -->
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Angle View Tag Header Pill -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="220" height="42" rx="10" fill="#115e59"/>
    <text x="110" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">📷 BACK VIEW</text>
  </g>

  <!-- Product Category Badge -->
  <g transform="translate(560, 40)">
    <rect x="0" y="0" width="200" height="42" rx="10" fill="#ffffff" stroke="#115e59" stroke-width="2"/>
    <text x="100" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#115e59" text-anchor="middle">MOBILES</text>
  </g>

  <!-- MAIN PRODUCT GRAPHIC (3D Rendered Perspective) -->
  <g filter="url(#dropShadow)">
    
                <!-- Phone Back Panel (Matching Color, Camera Island, Logo) -->
                <rect x="270" y="170" width="260" height="420" rx="36" fill="#0d9488" stroke="#115e59" stroke-width="8" />
                <!-- Camera Island Bump -->
                <rect x="295" y="195" width="100" height="130" rx="20" fill="#115e59" stroke="#ffffff" stroke-width="2" />
                <circle cx="345" cy="235" r="22" fill="#000000" stroke="#666666" stroke-width="4" />
                <circle cx="345" cy="235" r="10" fill="#1e293b" />
                <circle cx="345" cy="290" r="18" fill="#000000" stroke="#666666" stroke-width="4" />
                <circle cx="380" cy="235" r="8" fill="#fef08a" /> <!-- LED Flash -->
                <!-- Rear Brand Emblem -->
                <text x="400" y="520" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">ONEPLUS</text>
            
  </g>

  <!-- Footer Product Model Consistency Label -->
  <g transform="translate(40, 525)">
    <rect x="0" y="0" width="720" height="38" rx="8" fill="#ffffff" opacity="0.9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Product #37: OnePlus Nord Series</text>
    <text x="700" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#0d9488" text-anchor="end">MATCHING MODEL VISUAL GUARANTEE ✓</text>
  </g>
</svg>