<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Canvas Card -->
  <rect width="800" height="600" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Outer Frame Boundary -->
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Angle View Tag Header Pill -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="220" height="42" rx="10" fill="#475569"/>
    <text x="110" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">📷 BACK VIEW</text>
  </g>

  <!-- Product Category Badge -->
  <g transform="translate(560, 40)">
    <rect x="0" y="0" width="200" height="42" rx="10" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <text x="100" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#475569" text-anchor="middle">CLOTHES</text>
  </g>

  <!-- MAIN PRODUCT GRAPHIC (3D Rendered Perspective) -->
  <g filter="url(#dropShadow)">
    
                <!-- Garment Back View (Same Color & Cut, Back Neck Seam, Plain Back) -->
                <path d="M 220 220 L 290 280 L 260 340 L 220 310 L 220 540 L 580 540 L 580 310 L 540 340 L 510 280 L 580 220 L 490 210 Q 400 230 310 210 Z" fill="#64748b" stroke="#475569" stroke-width="8" />
                <path d="M 310 210 Q 400 230 490 210" fill="none" stroke="#475569" stroke-width="12" />
                <!-- Back Collar Seam & Hanger Loop -->
                <line x1="330" y1="230" x2="470" y2="230" stroke="#475569" stroke-width="6" stroke-dasharray="8 6" />
                <rect x="380" y="240" width="40" height="20" rx="4" fill="#475569" />
                <text x="400" y="254" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">BACK</text>
                <text x="400" y="420" font-size="20" font-weight="900" fill="#475569" text-anchor="middle" opacity="0.6">MANGO DENIM</text>
            
  </g>

  <!-- Footer Product Model Consistency Label -->
  <g transform="translate(40, 525)">
    <rect x="0" y="0" width="720" height="38" rx="8" fill="#ffffff" opacity="0.9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Product #14: Women's Denim Jacket</text>
    <text x="700" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#64748b" text-anchor="end">MATCHING MODEL VISUAL GUARANTEE ✓</text>
  </g>
</svg>