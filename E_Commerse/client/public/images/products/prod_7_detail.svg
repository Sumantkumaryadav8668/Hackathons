<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Canvas Card -->
  <rect width="800" height="600" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Outer Frame Boundary -->
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Angle View Tag Header Pill -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="220" height="42" rx="10" fill="#d97706"/>
    <text x="110" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">📷 DETAIL MACRO VIEW</text>
  </g>

  <!-- Product Category Badge -->
  <g transform="translate(560, 40)">
    <rect x="0" y="0" width="200" height="42" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text x="100" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#d97706" text-anchor="middle">CLOTHES</text>
  </g>

  <!-- MAIN PRODUCT GRAPHIC (3D Rendered Perspective) -->
  <g filter="url(#dropShadow)">
    
                <!-- Micro Texture Fabric Zoom View -->
                <rect x="220" y="200" width="360" height="340" rx="16" fill="#f59e0b" stroke="#d97706" stroke-width="10" />
                <!-- Fabric Weave Lines -->
                <pattern id="weave" width="20" height="20" patternUnits="userSpaceOnUse">
                    <line x1="0" y1="0" x2="20" y2="20" stroke="#d97706" stroke-width="3" opacity="0.4"/>
                    <line x1="20" y1="0" x2="0" y2="20" stroke="#fef08a" stroke-width="2" opacity="0.3"/>
                </pattern>
                <rect x="220" y="200" width="360" height="340" rx="16" fill="url(#weave)" />
                <!-- Embossed Brand Patch & Stitching -->
                <rect x="280" y="310" width="240" height="120" rx="12" fill="#d97706" stroke="#fef08a" stroke-width="6" stroke-dasharray="10 6" />
                <text x="400" y="365" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">FirstCry</text>
                <text x="400" y="400" font-size="14" font-weight="bold" fill="#fef08a" text-anchor="middle">AUTHENTIC FABRIC WEAVE</text>
            
  </g>

  <!-- Footer Product Model Consistency Label -->
  <g transform="translate(40, 525)">
    <rect x="0" y="0" width="720" height="38" rx="8" fill="#ffffff" opacity="0.9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Product #7: Kids Cotton Printed T-Shirt</text>
    <text x="700" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#f59e0b" text-anchor="end">MATCHING MODEL VISUAL GUARANTEE ✓</text>
  </g>
</svg>