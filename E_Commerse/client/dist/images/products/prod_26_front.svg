<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Canvas Card -->
  <rect width="800" height="600" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Outer Frame Boundary -->
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Angle View Tag Header Pill -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="220" height="42" rx="10" fill="#92400e"/>
    <text x="110" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">📷 FRONT VIEW</text>
  </g>

  <!-- Product Category Badge -->
  <g transform="translate(560, 40)">
    <rect x="0" y="0" width="200" height="42" rx="10" fill="#ffffff" stroke="#92400e" stroke-width="2"/>
    <text x="100" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#92400e" text-anchor="middle">SHOES</text>
  </g>

  <!-- MAIN PRODUCT GRAPHIC (3D Rendered Perspective) -->
  <g filter="url(#dropShadow)">
    
                <!-- Shoe Front / 3-Quarter Perspective -->
                <path d="M 280 440 Q 300 260 400 240 Q 500 260 520 440 L 540 490 Q 400 530 260 490 Z" fill="#d97706" stroke="#92400e" stroke-width="8" />
                <!-- Toe Cap & Laces -->
                <path d="M 330 380 Q 400 350 470 380 L 460 480 Q 400 500 340 480 Z" fill="#92400e" />
                <line x1="360" y1="310" x2="440" y2="310" stroke="#fef08a" stroke-width="8" />
                <line x1="365" y1="340" x2="435" y2="340" stroke="#fef08a" stroke-width="8" />
                <line x1="370" y1="370" x2="430" y2="370" stroke="#fef08a" stroke-width="8" />
                <!-- Sole Front -->
                <path d="M 250 490 Q 400 540 550 490 L 550 530 Q 400 560 250 530 Z" fill="#fef08a" stroke="#92400e" stroke-width="4" />
                <text x="400" y="290" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Metro</text>
            
  </g>

  <!-- Footer Product Model Consistency Label -->
  <g transform="translate(40, 525)">
    <rect x="0" y="0" width="720" height="38" rx="8" fill="#ffffff" opacity="0.9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Product #26: Women's Flat Sandals</text>
    <text x="700" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#d97706" text-anchor="end">MATCHING MODEL VISUAL GUARANTEE ✓</text>
  </g>
</svg>