<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Canvas Card -->
  <rect width="800" height="600" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Outer Frame Boundary -->
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Angle View Tag Header Pill -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="220" height="42" rx="10" fill="#5b21b6"/>
    <text x="110" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">📷 DETAIL MACRO VIEW</text>
  </g>

  <!-- Product Category Badge -->
  <g transform="translate(560, 40)">
    <rect x="0" y="0" width="200" height="42" rx="10" fill="#ffffff" stroke="#5b21b6" stroke-width="2"/>
    <text x="100" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#5b21b6" text-anchor="middle">LAPTOPS</text>
  </g>

  <!-- MAIN PRODUCT GRAPHIC (3D Rendered Perspective) -->
  <g filter="url(#dropShadow)">
    
                <!-- Keyboard Deck Top-Down View -->
                <rect x="220" y="200" width="360" height="340" rx="16" fill="#5b21b6" stroke="#ffffff" stroke-width="6" />
                <!-- Key Grid -->
                <rect x="240" y="220" width="320" height="180" rx="8" fill="#7c3aed" stroke="#475569" stroke-width="4" />
                <text x="400" y="310" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">PRECISION KEYBOARD</text>
                <!-- Trackpad -->
                <rect x="330" y="420" width="140" height="90" rx="6" fill="#334155" stroke="#ddd6fe" stroke-width="3" />
            
  </g>

  <!-- Footer Product Model Consistency Label -->
  <g transform="translate(40, 525)">
    <rect x="0" y="0" width="720" height="38" rx="8" fill="#ffffff" opacity="0.9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Product #64: ASUS VivoBook</text>
    <text x="700" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#7c3aed" text-anchor="end">MATCHING MODEL VISUAL GUARANTEE ✓</text>
  </g>
</svg>