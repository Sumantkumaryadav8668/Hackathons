<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Canvas Card -->
  <rect width="800" height="600" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Outer Frame Boundary -->
  <rect x="20" y="20" width="760" height="560" rx="16" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Angle View Tag Header Pill -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="220" height="42" rx="10" fill="#000000"/>
    <text x="110" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">📷 BACK VIEW</text>
  </g>

  <!-- Product Category Badge -->
  <g transform="translate(560, 40)">
    <rect x="0" y="0" width="200" height="42" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="100" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#000000" text-anchor="middle">SHOES</text>
  </g>

  <!-- MAIN PRODUCT GRAPHIC (3D Rendered Perspective) -->
  <g filter="url(#dropShadow)">
    
                <!-- Shoe Back Heel View -->
                <path d="M 320 230 Q 400 220 480 230 L 500 490 Q 400 520 300 490 Z" fill="#111827" stroke="#000000" stroke-width="8" />
                <!-- Heel Collar & Pull Tab -->
                <rect x="380" y="190" width="40" height="50" rx="8" fill="#f59e0b" stroke="#000000" stroke-width="4" />
                <path d="M 350 320 Q 400 300 450 320 L 460 490 Q 400 510 340 490 Z" fill="#000000" />
                <!-- Back Heel Brand Logo -->
                <circle cx="400" cy="380" r="30" fill="#f59e0b" />
                <text x="400" y="386" font-size="14" font-weight="900" fill="#111827" text-anchor="middle">P</text>
                <!-- Sole Back -->
                <path d="M 290 490 Q 400 520 510 490 L 510 530 Q 400 550 290 530 Z" fill="#f59e0b" />
            
  </g>

  <!-- Footer Product Model Consistency Label -->
  <g transform="translate(40, 525)">
    <rect x="0" y="0" width="720" height="38" rx="8" fill="#ffffff" opacity="0.9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#334155">Product #23: Men's Casual Sneakers</text>
    <text x="700" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#111827" text-anchor="end">MATCHING MODEL VISUAL GUARANTEE ✓</text>
  </g>
</svg>